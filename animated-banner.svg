<svg fill="none" viewBox="0 0 800 220" width="800" height="220" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          background-color: #0d1117;
          border: 1px solid #30363d;
          border-radius: 12px;
          padding: 20px 24px;
          font-family: 'Fira Code', 'Courier New', monospace;
          box-sizing: border-box;
          height: 220px;
        }
        .header {
          display: flex;
          gap: 8px;
          margin-bottom: 18px;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }
        
        .prompt {
          color: #8b949e;
          font-size: 14px;
          margin: 0 0 16px 0;
        }
        .prompt span {
          color: #58a6ff;
        }

        .animated-wrapper {
          display: inline-block;
        }

        .animated-text {
          font-size: 32px;
          font-weight: 700;
          letter-spacing: 3px;
          white-space: pre;
          color: #58a6ff;
          overflow: hidden;
          border-right: 3px solid #58a6ff;
          width: 0;
          /* 11 karakter: ALFIANNR234 */
          animation: type-and-back 5s steps(11, end) infinite, blink 0.75s step-end infinite;
        }

        /* Animasi mengetik maju, jeda, lalu mundur */
        @keyframes type-and-back {
          0% { width: 0; }
          35% { width: 11ch; }   /* Selesai ngetik maju */
          65% { width: 11ch; }   /* Tahan sebentar */
          90% { width: 0; }      /* Hapus mundur */
          100% { width: 0; }
        }

        /* Kursor berkedip */
        @keyframes blink {
          50% { border-color: transparent; }
        }
      </style>

      <div class="container">
        <div class="header">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
        <div class="prompt">
          <span>alfiannr234@github</span>:~$ ./wordmark.sh --name
        </div>
        <div class="animated-wrapper">
          <div class="animated-text">ALFIANNR234</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
